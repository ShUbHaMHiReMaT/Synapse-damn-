<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HACFY</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="topbar">
      <a href="{{ url_for('dashboard') }}">HACFY</a>
      {% if session.username %}
        <span class="right">Logged in as {{ session.username }} ({{ session.role }}) | <a href="{{ url_for('logout') }}">Logout</a></span>
      {% endif %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <small>HACFY MVP</small>
  </footer>
</body>
</html>

{% raw %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}FinSecure{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <nav class="navbar">
        <a class="navbar-brand" href="{{ url_for('upload') }}"></a>
        <div class="nav-right">
          <div class="contact">+91 - 9334 133 228</div>
          <a class="nav-link" href="{{ url_for('upload') }}">User Upload</a>
          <a class="nav-link" href="{{ url_for('admin') }}">Admin Dashboard</a>
        </div>
      </nav>
    </header>

    <main class="main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div><strong>Team DAMM</strong> • Demo UI — © {{ current_year or 2025 }} FinSecure</div>
    </footer>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
{% endraw %}
